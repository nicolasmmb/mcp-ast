name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push next version tag
        id: compute
        run: |
          set -euo pipefail
          git fetch --tags --force
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
          MAJOR=${LAST#v}; MAJOR=${MAJOR%%.*}
          REST=${LAST#*.}; MINOR=${REST%%.*}
          PATCH=${LAST##*.}
          if git rev-parse -q --verify "refs/tags/$LAST" >/dev/null 2>&1; then
            if git log "$LAST..HEAD" --format=%s | grep -qE '^(feat|feat\(|feat!|refactor!|BREAKING)'; then
              MINOR=$((MINOR + 1)); PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
          else
            MINOR=$((MINOR + 1)); PATCH=0
          fi
          NEXT="v$MAJOR.$MINOR.$PATCH"
          if git rev-parse -q --verify "refs/tags/$NEXT" >/dev/null 2>&1; then
            echo "tag $NEXT already exists, skipping push"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$NEXT" -m "release $NEXT"
            git push origin "$NEXT"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-14
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            runner: windows-latest
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        shell: bash
        run: go vet ./... && go test ./...

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="ast-mcp-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "$out" ./cmd/ast-mcp
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "(Get-FileHash -Algorithm SHA256 '$out').Hash.ToLower() + '  ' + '$out'" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ast-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ast-mcp-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version }}
          files: dist/**/ast-mcp-*
