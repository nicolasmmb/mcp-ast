name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: darwin
            goarch: arm64
            runner: macos-14
          - goos: windows
            goarch: amd64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        shell: bash
        run: go vet ./... && go test ./...

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          out="ast-mcp-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" ./cmd/ast-mcp
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "(Get-FileHash -Algorithm SHA256 '$out').Hash.ToLower() + '  ' + '$out'" > "$out.sha256"
          else
            shasum -a 256 "$out" > "$out.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ast-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ast-mcp-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/ast-mcp-*
